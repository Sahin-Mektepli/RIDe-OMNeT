[General]
network = BlockchainNetwork
*.iotNode*.inoutGateSize = 10
sim-time-limit = 1000s
*.iotNode*.serviceInterval = uniform(1, 5)
*.numNodes = 10
**.clusterCount = 1
**.clusterSize = int(numNodes / clusterCount)

**.attackerType = 1
#BENEVOLENT,    0
#CAMOUFLAGE,    1
#BAD_MOUTHING,  2
#MALICIOUS_100, 3
#COLLABORATIVE, 4
#OPPORTUNISTIC  5
#HYBRID         6
#GOV_PRIV       7

**.privPercentage = 0.7     # bu kadar cihaz hususi
**.privateTrustCoef = 0.5   # başta hususiler yarım adam
**.govBusyRate = 0.7        # !!! bence bu priv oranıyla aynı olmalı
**.serviceToForgetPriv = 500 # 20 servis verince hususi olduğu unutuluyormuş
**.maliciousNodePercentage = 0.3


# bunlar bana lazım
**.scalar-recording = true
**.vector-recording = true

### ben de AI kullanarak hazır configler oluşturdum :p
# --- SENARYO 1: Tamamen Hususi ve Kaotik ---
[Config PurePrivateCamouflage]
extends = General
description = "Sadece hususi dugumler, devlet yok, kaos var"
**.privPercentage = 1.0           # Hepsi Private
**.privateTrustCoef = 0.1         # Güven kazanmak zor
**.maliciousNodePercentage = 0.5  # 50 tane de kötücül düğüm var
**.govBusyRate = 1.0              # there shouldn't be any govs here anyways.
*.numNodes = 100
**.attackerType = 1
**.camouflageRate = 0.5

# --- SENARYO 2: Resmi Düğümlerle Kurtuluş ---
[Config WithGovernmentCamouflage]
extends = General
description = "Kaosun icine %10 resmi dugum eklendi"
**.privPercentage = 0.9           # 10 Resmi
**.privateTrustCoef = 0.1
**.maliciousNodePercentage = 0.5  # !! Resmi düğümlerin kötücül olmamasına dikkat !!
**.govBusyRate = 0.0              # !! TODO !! this is not clear at all!
*.numNodes = 100
**.attackerType = 1
**.camouflageRate = 0.5
# I think the govs should not be giving 10% of all the services in this case
# but removing the business mechanism entirely seems to be too much as well.


#################################################
# Old fixed-seed config (single run)
[Config SingleRun1]
extends = General
seed-set = 123
**.maliciousNodePercentage = 0.3

#################################################
# New config: sweep ratios, 10 seeds each
[Config Batch10]
extends = General


# sweep malicious node ratios
**.maliciousNodePercentage = ${ratio=0.2,0.3,0.4,0.5}

# repeat each ratio 10 times with different seeds
repeat = 10
seed-set = ${repetition}

# results stored under: results/Batch10/ratio=0.3/rep=7
result-dir = results/${configname}/ratio=${ratio}/rep=${repetition}

# avoid heavy event logs if not needed
record-eventlog = false
[Config CamouflageSweep]
extends = General
**.maliciousNodePercentage = 0.3

# sweep camouflageRate: 0.1, 0.3, 0.5, 0.7, 0.9
**.camouflageRate = ${rate=0.1,0.3,0.5,0.7,0.9}

# repeat each setting 10 times with different seeds
repeat = 10
seed-set = ${repetition}

# result directory structure
result-dir = results/${configname}/rate=${rate}/rep=${repetition}

record-eventlog = false
[Config CamouflageShort]
extends = General
**.maliciousNodePercentage = 0.3

# sweep camouflageRate: 0.1, 0.3, 0.5, 0.7, 0.9
**.camouflageRate = ${rate=0.1,0.3,0.5,0.7,0.9}

# repeat each setting 10 times with different seeds
repeat = 10
seed-set = ${repetition}

# result directory structure
result-dir = results/${configname}/rate=${rate}/rep=${repetition}

record-eventlog = false
[Config OpportunisticSweep]
extends = General
**.maliciousNodePercentage = 0.3
# ensure we run opportunistic attacker behavior explicitly
**.attackerType = 5

# sweep malicious node ratios (same ratios as Batch10)
#**.maliciousNodePercentage = ${ratio=0.2,0.3,0.4,0.5}

# if your model supports a specific opportunistic parameter (e.g. opportunisticRate),
# you can add it here similarly:
# **.opportunisticRate = ${opprate=0.1,0.3,0.5}
# (Left commented—uncomment and adapt if you have such a parameter)

# repeat each ratio 10 times with different seeds
repeat = 10
seed-set = ${repetition}

# result directory structure
result-dir = results/${configname}/rep=${repetition}

record-eventlog = false
[Config HybridSweep]
extends = General

**.maliciousNodePercentage = ${ratio=0.2,0.3,0.4,0.5}
**.attackerType = 6      # HYBRID attacker

# if you want to sweep switch times:
# **.hybridSwitchTime = ${ts=300,500,700}

repeat = 10
seed-set = ${repetition}

result-dir = results/${configname}/rep=${repetition}

record-eventlog = false
