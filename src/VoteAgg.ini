[General]
network = VoteAggNetwork
sim-time-limit = 2000s

# Node vector / topology parameters
*.numNodes = 100
**.clusterCount = 2
**.clusterSize = int(numNodes / clusterCount)
*.voteAggNode[*].interactionWindow = 10s#50 idi

# VoteAgg node parameters
*.voteAggNode[*].inoutGateSize = 10
*.voteAggNode[*].serviceInterval = uniform(1s, 5s)
*.voteAggNode[*].globalTrustUpdateInterval = 10s #şimdilik böyle 10 saniyede bir global listeyi güncelliyoruz
*.voteAggNode[*].aggregationMethod = 0  # additive | multiplicative | borda
*.voteAggNode[*].providerAvailabilityProbability = 0.5
*.voteAggNode[*].rancorFactor = 3.0
# Attacker setup
**.attackerType = 2
# BENEVOLENT      0
# MALICIOUS_100   1
# CAMOUFLAGE      2
# BAD_MOUTHING    3
# OPPORTUNISTIC   4
# COLLABORATIVE   5
# HYBRID          6

#################################################


# -------------------------------------------------------------------
# Experiment sweeps for the updated VoteAgg code
#
# aggregationMethod:
#   0 = Additive
#   1 = Multiplicative
#   2 = Borda
#   3 = Approval
# 
#
# selectionMode:
#   0 = DT + GT dynamic merge
#   1 = Direct Trust only baseline
#   2 = Global Trust only baseline
#
# directTrustMethod:
#   0 = Simple
#   1 = Weighted
#   2 = Rancorous
#   3 = Time-decay
#   4 = Rancorous + time-decay
# -------------------------------------------------------------------

[Config SelectionModeSweepOpportunisticeWindow10]
description = "Test each global aggregation method under DT+GT merge, DT-only, and GT-only selection modes."
**.attackerType = 4
# Keep this if your previous experiments used 2000s.
sim-time-limit = 2000s
**.maliciousNodePercentage = 0.4
#*.voteAggNode[*].camouflageRate = 0.4
# Store this experiment family separately.
result-dir = results/${configname}/agg-${agg}/selection-${sel}/run-${repetition}

# Optional but useful for reproducible repeated runs.
repeat = 10
seed-set = ${repetition}

# Common trust/window settings.


*.voteAggNode[*].minDirectEvidence = 1
*.voteAggNode[*].directTrustPriorMass = 0.0

*.voteAggNode[*].directTrustDecayRate = 0.05

# Sweep 6 aggregation methods x 3 selection modes.
*.voteAggNode[*].aggregationMethod = ${agg=0,1,2,3}
*.voteAggNode[*].selectionMode = ${sel=0,1,2}

# Fix DT method to simple DT in this test, so only selection mode changes.
*.voteAggNode[*].directTrustMethod = 0


[Config DirectTrustMethodSweepOpportunistic10]
description = "Test each global aggregation method with different local Direct Trust calculation methods."
**.attackerType = 4
sim-time-limit = 2000s

# Store this experiment family separately.
result-dir = results/${configname}/agg-${agg}/dt-${dt}/run-${repetition}
**.maliciousNodePercentage = 0.4
#*.voteAggNode[*].camouflageRate = 0.4
repeat = 10
seed-set = ${repetition}

# Common trust/window settings.

*.voteAggNode[*].minDirectEvidence = 1
*.voteAggNode[*].directTrustPriorMass = 0.0

*.voteAggNode[*].directTrustDecayRate = 0.05

# Sweep 6 aggregation methods x 5 DT calculation methods.
*.voteAggNode[*].aggregationMethod = ${agg=0,1,2,3}
*.voteAggNode[*].directTrustMethod = ${dt=0,1,2,3,4}

# Use the proposed DT+GT merge so both the selected DT formula and GT aggregation matter.
*.voteAggNode[*].selectionMode = 0

