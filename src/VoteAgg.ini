[General]
network = VoteAggNetwork
sim-time-limit = 2000s

# Node vector / topology parameters
*.numNodes = 100
**.clusterCount = 1
**.clusterSize = int(numNodes / clusterCount)

# VoteAgg node parameters
*.voteAggNode[*].inoutGateSize = 10
*.voteAggNode[*].serviceInterval = uniform(1s, 5s)
*.voteAggNode[*].globalTrustUpdateInterval = 10s #şimdilik böyle 10 saniyede bir global listeyi güncelliyoruz
*.voteAggNode[*].aggregationMethod = 0  # additive | multiplicative | borda

# Attacker setup
**.attackerType = 4
# BENEVOLENT      0
# MALICIOUS_100   1
# CAMOUFLAGE      2
# BAD_MOUTHING    3
# OPPORTUNISTIC   4
# COLLABORATIVE   5
# HYBRID          6

#################################################
# Old fixed-seed config (single run)
[Config SingleRun1]
extends = General
seed-set = 123
**.maliciousNodePercentage = 0.3

#################################################
# Sweep malicious node ratios, 10 seeds each
[Config Batch10]
extends = General
**.maliciousNodePercentage = ${ratio=0.2,0.3,0.4,0.5}
repeat = 10
seed-set = ${repetition}
result-dir = results/${configname}/ratio=${ratio}/rep=${repetition}
record-eventlog = false

#################################################
# Aggregation method sweeps
[Config VoteAggMethodSweep]
extends = General
#stringler hata verince sayı vermem gerekti
# 0 = additive, 1 = multiplicative, 2 = borda
*.voteAggNode[*].aggregationMethod = ${method=0,1,2}

repeat = 10
seed-set = ${repetition}

result-dir = results/${configname}/method=${method}/rep=${repetition}

record-eventlog = false

[Config Additive]
extends = General
*.voteAggNode[*].aggregationMethod = 0
**.maliciousNodePercentage = 0.3
repeat = 10
seed-set = ${repetition}
result-dir = results/${configname}/rep=${repetition}
record-eventlog = false

[Config Multiplicative]
