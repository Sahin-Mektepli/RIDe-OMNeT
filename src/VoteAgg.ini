# ============================================================
# Attack x Aggregation x Selection Mode Sweep
# ============================================================
# attack:
#   8  = Intermittent Availability
#   9  = Selective Service
#   10 = Threshold Gaming
#   11 = Balanced Good-Bad
#
# aggregationMethod:
#   0 = Additive
#   1 = Multiplicative
#   2 = Borda
#   3 = Approval
#
# selectionMode:
#   0 = DT + GT Merge
#   1 = DT-only
#   2 = GT-only
#
# directTrustMethod:
#   0 = Simple DT
# ============================================================

[Config AttackAggregationSelectionSweep2]
extends = General

description = "Tests all aggregation models with DT+GT merge, DT-only, and GT-only under different attack models."

# ------------------------------------------------------------
# Simulation duration and repetitions
# ------------------------------------------------------------
sim-time-limit = 2000s
repeat = 5
seed-set = ${repetition}

# ------------------------------------------------------------
# Result folder structure
# ------------------------------------------------------------
result-dir = results/AttackAggregationSelectionSweep/attack-${attack}/agg-${agg}/directtrust-${dt}/run-${repetition}

# ------------------------------------------------------------
# Main sweep variables
# ------------------------------------------------------------

# 8  = Intermittent Availability
# 9  = Selective Service
# 10 = Threshold Gaming
# 11 = Balanced Good-Bad
*.attackerType = ${attack=8,9,10,11}

# 0 = Additive
# 1 = Multiplicative
# 2 = Borda
# 3 = Approval
*.voteAggNode[*].aggregationMethod = ${agg=0,1,2,3}

# 0 = DT + GT Merge
# 1 = DT-only
# 2 = GT-only
*.voteAggNode[*].selectionMode = 0

# Keep Direct Trust calculation fixed in this experiment.
# This isolates the effect of aggregation method and selection mode.
*.voteAggNode[*].directTrustMethod = ${dt=0,1,2,3,4}

# ------------------------------------------------------------
# General trust parameters
# ------------------------------------------------------------
*.voteAggNode[*].interactionWindow = 10s
*.voteAggNode[*].globalTrustUpdateInterval = 10s

*.voteAggNode[*].minDirectEvidence = 1
*.voteAggNode[*].directTrustPriorMass = 0.0

# Evidence threshold used in dynamic DT+GT merge:
# w_DT = n_ij / (n_ij + tau)
*.voteAggNode[*].evidenceThreshold = 3

# Approval threshold used by Approval aggregation
*.voteAggNode[*].approval_threshold = 0.5


# ------------------------------------------------------------
# Provider availability
# ------------------------------------------------------------
*.voteAggNode[*].providerAvailabilityProbability = 0.5

# ------------------------------------------------------------
# Attack parameters
# ------------------------------------------------------------

# Intermittent Availability Attack
# Attacker gives bad service, then hides from the same requester.
*.voteAggNode[*].intermittentCooldownTime = 15s
*.voteAggNode[*].intermittentBadServiceProbability = 1.0

# Selective Service Attack
# Example: even requester IDs are victims.
*.voteAggNode[*].selectiveVictimModulo = 2
*.voteAggNode[*].selectiveVictimRemainder = 0

# Threshold Gaming Attack
# Attacker tries to keep DT slightly above approval threshold.
*.voteAggNode[*].thresholdGamingMargin = 0.05

# ------------------------------------------------------------
# Attack intensity
# ------------------------------------------------------------
*.voteAggNode[*].maliciousNodePercentage = 0.4
